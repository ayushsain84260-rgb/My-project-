<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayush Sain | Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .card {
      background: #1e293b;
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid #334155;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0 auto 1.5rem auto;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    .tagline {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    .bio {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
      text-align: left;
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
    }
    .section-title {
      font-size: 1.1rem;
      margin-bottom: 0.8rem;
      text-align: left;
      color: #38bdf8;
    }
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .skill-badge {
      background: #334155;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #e2e8f0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-decoration: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: bold;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">AS</div>
    <h1>Ayush Sain</h1>
    <p class="tagline">Developer & Tech Enthusiast</p>

    <h2 class="section-title">About Me</h2>
    <p class="bio">
      Namaste! Welcome to my personal website. Main yahan apne naye projects, coding experiments aur ideas share karta hoon.
    </p>

    <h2 class="section-title">My Interests & Skills</h2>
    <div class="skills">
      <span class="skill-badge">Web Development</span>
      <span class="skill-badge">GitHub</span>
      <span class="skill-badge">Technology</span>
      <span class="skill-badge">Open Source</span>
    </div>

    <a href="https://github.com" target="_blank" class="btn">View My GitHub</a>
  </div>

</body>
</html>
